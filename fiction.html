<!DOCTYPE html>
<html lang="zh">

<head>
    <script>
        window.location.replace('blood_hall.html');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="description" content="Miraiyahu 小說 ARCHIVES — 血色堂屋及更多長篇敘事作品。">
    <title>Miraiyahu | 小說 ARCHIVES</title>
    <style>
        :root {
            --x: 50%;
            --y: 50%;
            --border-color: #6b5c4d;
            --text-color: #d1ccb8;
            --bg-glass: rgba(10, 8, 5, 0.9);
            --accent: #495945;
            /* 廢土綠 */
        }

        body {
            background-color: #1a1510;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: "Georgia", "Times New Roman", "Songti TC", "Songti SC", "SimSun", "Noto Serif CJK TC", "Noto Serif CJK SC", serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景與濾鏡 (延續 WIRED 風格) */
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('wired-bg.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.5;
            z-index: 1;
            filter: sepia(50%) contrast(120%) brightness(50%);
            /* 更暗的背景以利閱讀 */
            pointer-events: none;
        }

        .noise-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: repeating-radial-gradient(circle at center, rgba(10, 10, 10, 0.2) 0, transparent 2px);
            pointer-events: none;
            filter: contrast(150%) brightness(120%) sepia(30%);
            opacity: 0.4;
            z-index: 2;
        }

        .scanlines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(20, 20, 20, 0.4) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
        }

        .frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.1), inset 0 0 3px rgba(100, 100, 100, 0.5);
            border: 2px solid rgba(50, 50, 50, 0.8);
            box-sizing: border-box;
        }

        /* 閱讀介面主容器 (左右拆分) */
        .workspace {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            background: var(--bg-glass);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            animation: bootUp 1s ease-out forwards;
        }

        @keyframes bootUp {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 左側目錄區 */
        .sidebar {
            width: 250px;
            border-right: 2px double var(--border-color);
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.3);
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px dotted var(--border-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            letter-spacing: 0.2rem;
            color: #8c7e6b;
            text-align: center;
        }

        .directory-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .directory-item {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid rgba(107, 92, 77, 0.3);
            text-decoration: none;
            display: block;
            color: var(--text-color);
            font-size: 1.1rem;
            letter-spacing: 0.1rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .directory-item:hover,
        .directory-item.active {
            background: rgba(44, 54, 39, 0.6);
            /* Active/Hover state: Wasteland Green */
            color: #fff;
            padding-left: 2rem;
            box-shadow: inset 4px 0 0 var(--border-color);
        }

        .directory-item.active::before {
            content: '> ';
            font-family: 'Courier New';
            color: var(--border-color);
        }

        /* 右側內文閱讀區 */
        .content-area {
            flex-grow: 1;
            padding: 4rem 6rem;
            overflow-y: auto;
            position: relative;
        }

        /* 滾動條樣式隱藏或特製化以符合復古感 */
        .content-area::-webkit-scrollbar,
        .directory-list::-webkit-scrollbar {
            width: 8px;
        }

        .content-area::-webkit-scrollbar-track,
        .directory-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.5);
            border-left: 1px solid var(--border-color);
        }

        .content-area::-webkit-scrollbar-thumb,
        .directory-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
        }

        .story-title {
            font-size: 2.5rem;
            font-weight: 200;
            letter-spacing: 0.3rem;
            margin-top: 0;
            margin-bottom: 3rem;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 1rem;
            text-shadow: 0 0 8px rgba(209, 204, 184, 0.4);
        }

        .story-text {
            font-size: 1.1rem;
            line-height: 2.1;
            letter-spacing: 0.08rem;
            max-width: 700px;
            margin: 0 auto;
            text-align: justify;
        }

        .story-text p {
            margin-bottom: 2rem;
            text-indent: 0;
        }

        /* 等待輸入的閃爍游標 */
        .blinking-cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--border-color);
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* 返回按鈕 (統一放在左下) */
        .back-btn-container {
            padding: 1.5rem;
            border-top: 2px double var(--border-color);
            background: rgba(0, 0, 0, 0.5);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            height: 3rem;
            width: 100%;
            background: linear-gradient(135deg, #495945 0%, #2c2416 100%);
            color: #d1ccb8;
            border: 2px outset #7a8c73;
            border-bottom: 2px solid #1a150d;
            border-right: 2px solid #1a150d;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 0.1rem;
            text-decoration: none;
            transition: all 0.05s ease;
            cursor: pointer;
        }

        .btn:active {
            border: 2px inset #1a150d;
            border-bottom: 2px solid #7a8c73;
            border-right: 2px solid #7a8c73;
            transform: translate(1px, 1px);
        }

        .close-btn {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 100;
            color: var(--text-color);
            text-decoration: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(44, 54, 39, 0.8);
            color: #fff;
            box-shadow: 0 0 10px rgba(100, 255, 100, 0.2);
        }

        /* 游標微光互動 */
        .cursor-light {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle at var(--x) var(--y), rgba(209, 204, 184, 0.15) 0%, transparent 50%);
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 3;
            top: 0;
            left: 0;
        }

        .mobile-only-content {
            display: none;
        }
        .desktop-only-content {
            display: block;
        }

        /* 手機板響應式設計 (電腦端不用改) */
        @media (max-width: 768px) {
            body {
                overflow: hidden;
            }
            .mobile-only-content {
                display: block !important;
            }
            .desktop-only-content {
                display: none !important;
            }
            .workspace {
                flex-direction: column;
                height: 100vh;
            }
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                height: 100vh;
                z-index: 1000;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                background: rgba(10, 8, 5, 0.98);
                backdrop-filter: blur(20px);
                box-shadow: 5px 0 30px rgba(0, 0, 0, 0.8);
                border-right: 2px solid var(--border-color);
                border-bottom: none;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-header {
                display: block !important;
                padding: 1.5rem !important;
            }
            .sidebar-category {
                display: block !important;
            }
            .directory-list {
                display: block !important;
                overflow-y: auto !important;
                flex-grow: 1 !important;
                white-space: normal !important;
            }
            .directory-item {
                display: block !important;
                padding: 1.2rem 1.5rem !important;
                border-bottom: 1px solid rgba(107, 92, 77, 0.2) !important;
                border-right: none !important;
                font-size: 0.95rem !important;
                white-space: normal !important;
                height: auto !important;
            }
            .directory-item:hover,
            .directory-item.active {
                padding-left: 2rem !important;
                box-shadow: inset 4px 0 0 var(--border-color) !important;
            }
            .directory-item.active::before {
                content: '> ' !important;
            }
            .mobile-close-item {
                color: #8c7e6b !important;
                font-weight: bold;
                border-bottom: 2px solid var(--border-color) !important;
            }
            .back-btn-container {
                padding: 1.5rem !important;
                border-top: 2px double var(--border-color) !important;
                border-left: none !important;
                width: auto !important;
            }
            .btn {
                height: 3rem !important;
                font-size: 1rem !important;
            }
            .mobile-top-bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: rgba(10, 8, 5, 0.9);
                border-bottom: 1px solid var(--border-color);
                padding: 0.8rem 1.2rem;
                position: sticky;
                top: 0;
                z-index: 900;
                box-sizing: border-box;
                width: 100%;
            }
            .menu-toggle-btn {
                background: linear-gradient(135deg, #495945 0%, #2c2416 100%);
                color: #d1ccb8;
                border: 1px solid var(--border-color);
                padding: 0.5rem 1rem;
                font-family: inherit;
                font-size: 0.9rem;
                cursor: pointer;
            }
            .mobile-bar-title {
                color: var(--text-color);
                font-size: 1rem;
                font-weight: bold;
                letter-spacing: 0.1rem;
                text-align: right;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                max-width: 60%;
            }
            .content-area {
                padding: 1.5rem 1.8rem 4rem 1.8rem !important;
                flex-grow: 1;
                width: 100%;
                box-sizing: border-box;
            }
            .story-title {
                display: block !important;
                font-size: 1.8rem !important;
                margin-top: 1rem !important;
                margin-bottom: 2rem !important;
                text-align: center !important;
            }
            .story-text {
                font-size: 1.02rem !important;
                line-height: 1.85 !important;
                letter-spacing: 0.05rem !important;
                max-width: 100% !important;
            }
            /* Novel specific: keep H2 visible */
            .story-text h2 {
                margin-top: 4rem !important;
                margin-bottom: 2rem !important;
                font-size: 1.3rem !important;
                letter-spacing: 0.1rem !important;
                padding-bottom: 0.6rem !important;
            }
            .story-text h2:first-of-type {
                margin-top: 1.5rem !important;
            }
        }

    </style>
</head>

<body>
    <div class="bg-image"></div>
    <div class="cursor-light"></div>
    <div class="noise-overlay"></div>
    <div class="scanlines"></div>
    <div class="frame"></div>

    <div class="workspace">
        <!-- 左側目錄 -->
        <div class="sidebar">
            <div class="sidebar-header">
                INDEX / 小說
            </div>
            <div class="directory-list">
                <a href="blood_hall.html" class="directory-item" style="font-size: 1.1rem;">《血色堂屋》</a>
            </div>
            <div class="back-btn-container">
                <a href="wired.html#skip" class="btn">
                    << BACK TO WIRED</a>
            </div>
        </div>

        <!-- 右側閱讀區 -->
        <div class="content-area">
            <!-- 電腦端顯示區 -->
            <div class="desktop-only-content">
                <h1 class="story-title" style="color: #6b5c4d;">系統主機連線中...</h1>
                <div class="story-text" style="color: #8c7e6b;">
                    <p>等待載入文本紀錄... <span class="blinking-cursor"></span></p>
                    <p style="margin-top: 3rem; font-family: monospace; opacity: 0.6;">[SYSTEM_MSG] 請從目錄選擇要讀取的記憶封包。</p>
                </div>
            </div>

            <!-- 手機端顯示區 -->
            <div class="mobile-only-content">
                <h1 class="story-title" style="color: #6b5c4d;">小說 ARCHIVES</h1>
                <div class="story-text" style="color: #8c7e6b; text-align: center;">
                    <p style="font-size: 1.6rem; letter-spacing: 0.4rem; margin-top: 1.5rem;">小說 / FICTION</p>
                    <div style="margin-top: 2rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem;">
                        <a href="blood_hall.html" class="btn" style="min-width: 15rem; max-width: 90%; text-decoration: none;">《血色堂屋》</a>
                        <a href="wired.html#skip" class="btn" style="min-width: 15rem; max-width: 90%; text-decoration: none; background: linear-gradient(135deg, #2c2416 0%, #1a1510 100%); border-color: #6b5c4d;">返回 WIRED</a>
                    </div>
                    <p style="margin-top: 3rem; font-family: monospace; opacity: 0.6; font-size: 0.9rem;">[SYSTEM_MSG] 請點擊上方按鈕，或從目錄選擇要讀取的記憶封包。</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth * 100) + '%';
            const y = (e.clientY / window.innerHeight * 100) + '%';
            document.documentElement.style.setProperty('--x', x);
            document.documentElement.style.setProperty('--y', y);
        });
    </script>
</body>
</html>
